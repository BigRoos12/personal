<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Google Font -->

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <canvas id="particles"></canvas>
  <!-- Hero Section -->
<section class="hero">
  <h1 class="reveal">BIGROSS</h1>
  <p class="reveal">
    15 y/o Programmer • Psychology Enthusiast • Gen Z Mindset

      <div class="progress">
        <div class="progress-bar" data-progress="100"></div>
      </div>
    </div>

    <div class="skill-card reveal">
      <div class="skill-header">
        <span>JavaScript</span>
        <span class="percent" data-target="20">0%</span>
      </div>
      <div class="progress">
        <div class="progress-bar" data-progress="20"></div>
      </div>
    </div>

    <div class="skill-card reveal">
      <div class="skill-header">
        <span>HTML & CSS</span>
        <span class="percent" data-target="80">0%</span>
      </div>

      </div>
    </div>

    <div class="skill-card reveal">
      <div class="skill-header">
        <span>Python</span>
        <span class="percent" data-target="80">0%</span>
      </div>
      <div class="progress">
        <div class="progress-bar" data-progress="80"></div>
      </div>
    </div>

    <div class="skill-card reveal">
      <div class="skill-header">
        <span>PHP</span>
        <span class="percent" data-target="40">0%</span>
      </div>
      <div class="progress">
        <div class="progress-bar" data-progress="40"></div>
      </div>
    </div>

  </div>
</section>
<section class="section">
  <h2 class="section-title reveal">Interests</h2>

  <div class="cards">

    <div class="card reveal">
      <i class="fas fa-film"></i>
      <p>Movies & Series</p>
    </div>

    <div class="card reveal">
      <i class="fas fa-gamepad"></i>
      <p>Gaming</p>
    </div>

    <div class="card reveal">
      <i class="fas fa-brain"></i>
      <p>Psychology Analysis</p>
    </div>

    <div class="card reveal">
      <i class="fas fa-laptop-code"></i>
      <p>Programming</p>
    </div>

    <div class="card reveal">
      <i class="fas fa-music"></i>
      <p>Music & Podcasts</p>
    </div>

  </div>
</section>

  <!-- Contact -->
  <section class="section">
    <h2 class="section-title reveal">Contact</h2>

    <form class="contact-form reveal">
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <textarea placeholder="Message"></textarea>
      <button type="submit">Send</button>
    </form>

    <div class="socials reveal">
      <a href="https://github.com/BigRoos12"><i class="fab fa-github"></i></a>
      <a href="https://www.instagram.com/ali_n.i0/"><i class="fab fa-instagram"></i></a>
      <a href="@‌BIGRoss0"><i class="fab fa-telegram"></i></a>
    </div>
  </section>

  <footer>
    © 2026 BIGROSS — Ali
  </footer>

  <script src="script.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BIGROSS | Personal Website</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor"></div>

  <!-- Hero Section -->
  <section class="hero">
    <h1 class="reveal">BIGROSS</h1>
    <p class="reveal">
      15 y/o Programmer • Psychology Enthusiast • Gen Z Mindset
    </p>
    <span class="scroll-down">Scroll ↓</span>
  </section>

  <!-- Skills -->
  <section class="section">
    <h2 class="section-title reveal">Skills</h2>
    <div class="cards">
      <div class="card reveal">WordPress</div>
      <div class="card reveal">JavaScript</div>
      <div class="card reveal">Python</div>
      <div class="card reveal">HTML & CSS</div>
    </div>
  </section>

  <!-- Interests -->
  <section class="section">
    <h2 class="section-title reveal">Interests</h2>
    <div class="cards">
      <div class="card reveal">
        <i class="fas fa-film"></i>
        <p>Movies & Series</p>
      </div>
      <div class="card reveal">
        <i class="fas fa-gamepad"></i>
        <p>Gaming</p>
      </div>
      <div class="card reveal">
        <i class="fas fa-brain"></i>
        <p>Psychology Analysis</p>
      </div>
    </div>
  </section>

  <!-- Contact -->
  <section class="section">
    <h2 class="section-title reveal">Contact</h2>

    <form class="contact-form reveal">
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <textarea placeholder="Message"></textarea>
      <button type="submit">Send</button>
    </form>

    <div class="socials reveal">
      <a href="#"><i class="fab fa-github"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-telegram"></i></a>
    </div>
  </section>

  <footer>
    © 2026 BIGROSS — Ali
  </footer>

  <script src="script.js"></script>
</body>
</html>
